<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานสถานะน้ำท่วม กทม. จากกล้อง CCTV</title>
    
    <!-- Leaflet CSS (แผนที่ OpenSource) -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            font-family: 'Sarabun', sans-serif;
        }
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
        #map {
            height: 100vh;
            width: 100vw;
        }
        /* แผงควบคุมและสรุปสถานะด้านบน */
        .info-card {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            padding: 16px 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 340px;
            backdrop-filter: blur(5px);
        }
        .info-card h2 {
            margin: 0 0 8px 0;
            font-size: 18px;
            color: #1e293b;
        }
        .info-card p {
            margin: 4px 0;
            font-size: 13px;
            color: #475569;
        }
        .legend {
            display: flex;
            gap: 12px;
            margin-top: 10px;
            padding-top: 8px;
            border-top: 1px solid #e2e8f0;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            font-weight: 600;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
        }
        .dot-green { background-color: #22c55e; box-shadow: 0 0 6px rgba(34,197,94,0.6); }
        .dot-red { background-color: #ef4444; box-shadow: 0 0 6px rgba(239,68,68,0.6); }

        /* การแต่งสไตล์ Popup บนแผนที่ */
        .popup-content {
            width: 250px;
        }
        .popup-content h3 {
            margin: 0 0 6px 0;
            font-size: 15px;
            color: #0f172a;
        }
        .badge {
            display: inline-block;
            padding: 3px 8px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 8px;
        }
        .badge-normal { background-color: #dcfce7; color: #166534; }
        .badge-flooded { background-color: #fee2e2; color: #991b1b; }
        
        .cctv-container {
            position: relative;
            margin-top: 6px;
        }
        .cctv-preview {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #cbd5e1;
            background-color: #f1f5f9;
            display: block;
        }
        /* ปุ่มกด Refresh ภาพสด */
        .btn-refresh {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            width: 100%;
            margin-top: 8px;
            padding: 6px 12px;
            background-color: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }
        .btn-refresh:hover {
            background-color: #0369a1;
        }
        .btn-refresh:active {
            transform: scale(0.98);
        }
        .meta-text {
            font-size: 11px;
            color: #64748b;
            margin-top: 6px;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="info-card">
        <h2>🌊 รายงานสถานะน้ำท่วม กทม.</h2>
        <p>ตรวจสอบสภาพน้ำท่วมขังบนถนนผ่านกล้องวงจรปิด (CCTV)</p>
        <div class="legend">
            <div class="legend-item"><span class="dot dot-green"></span> ปกติ / ไม่ท่วม</div>
            <div class="legend-item"><span class="dot dot-red"></span> มีน้ำท่วมขัง</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. กำหนดพิกัดเริ่มต้นตรงกลางของ กรุงเทพมหานคร
        const map = L.map('map').setView([13.7563, 100.5018], 11);

        // 2. ดึงแผนที่ภาษาไทย/อังกฤษ จาก OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // 3. ข้อมูลจุดกล้อง CCTV ตัวอย่างในจุดสำคัญของ กทม.
        const cctvLocations = [
            {
                id: "CCTV-01",
                name: "แยกรัชดา-ลาดพร้าว",
                lat: 13.8062,
                lng: 100.5739,
                isFlooded: true,
                waterLevel: "ขังสูงประมาณ 10-15 ซม. (เลนซ้ายสุด)",
                baseUrl: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=500&q=80",
                updatedAt: "14:45 น."
            },
            {
                id: "CCTV-02",
                name: "แยกอโศกมนตรี",
                lat: 13.7370,
                lng: 100.5604,
                isFlooded: false,
                waterLevel: "แห้งปกติ",
                baseUrl: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=500&q=80",
                updatedAt: "14:50 น."
            },
            {
                id: "CCTV-03",
                name: "วงเวียนบางเขน (ถนนพหลโยธิน)",
                lat: 13.8753,
                lng: 100.5966,
                isFlooded: true,
                waterLevel: "ขังเล็กน้อย บริเวณทางเลี้ยว",
                baseUrl: "https://images.unsplash.com/photo-1506521781263-d8422e82f27a?w=500&q=80",
                updatedAt: "14:42 น."
            },
            {
                id: "CCTV-04",
                name: "แยกพระราม 9",
                lat: 13.7578,
                lng: 100.5662,
                isFlooded: false,
                waterLevel: "แห้งปกติ",
                baseUrl: "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=500&q=80",
                updatedAt: "14:51 น."
            },
            {
                id: "CCTV-05",
                name: "ถนนศรีนครินทร์ (แยกพัฒนาการ)",
                lat: 13.7336,
                lng: 100.6461,
                isFlooded: true,
                waterLevel: "เสี่ยงท่วมขังเสมอฟุตบาท",
                baseUrl: "https://images.unsplash.com/photo-1508873696983-2df515122519?w=500&q=80",
                updatedAt: "14:38 น."
            }
        ];

        // 4. ฟังก์ชันสำหรับโหลดรูปภาพใหม่ป้องกันแคช (Cache Busting)
        function refreshCCTVImage(imgId, baseUrl, timeId) {
            const imgElement = document.getElementById(imgId);
            const timeElement = document.getElementById(timeId);
            
            if (imgElement) {
                // เติม Timestamp เพื่อบังคับให้เบราว์เซอร์ดึงภาพเวอร์ชันล่าสุด
                const timestamp = new Date().getTime();
                const separator = baseUrl.includes('?') ? '&' : '?';
                imgElement.src = `${baseUrl}${separator}_t=${timestamp}`;
                
                // อัปเดตเวลาการกดดึงภาพล่าสุด
                if (timeElement) {
                    const now = new Date();
                    const hours = String(now.getHours()).padStart(2, '0');
                    const minutes = String(now.getMinutes()).padStart(2, '0');
                    const seconds = String(now.getSeconds()).padStart(2, '0');
                    timeElement.innerText = `อัปเดตล่าสุด: ${hours}:${minutes}:${seconds} น.`;
                }
            }
        }

        // 5. วนลูปปักหมุดลงบนแผนที่
        cctvLocations.forEach(loc => {
            const colorClass = loc.isFlooded ? '#ef4444' : '#22c55e';
            const customIcon = L.divIcon({
                className: 'custom-pin',
                html: `<div style="
                    background-color: ${colorClass};
                    width: 20px;
                    height: 20px;
                    border-radius: 50%;
                    border: 3px solid white;
                    box-shadow: 0 0 8px rgba(0,0,0,0.4);
                "></div>`,
                iconSize: [20, 20],
                iconAnchor: [10, 10]
            });

            const imgElementId = `img-${loc.id}`;
            const timeElementId = `time-${loc.id}`;

            const popupHtml = `
                <div class="popup-content">
                    <h3>${loc.name}</h3>
                    <span class="badge ${loc.isFlooded ? 'badge-flooded' : 'badge-normal'}">
                        ${loc.isFlooded ? '⚠️ พบน้ำท่วมขัง' : '✅ สภาพปกติ'}
                    </span>
                    <br>
                    <small><b>สถานะน้ำ:</b> ${loc.waterLevel}</small>
                    <div class="cctv-container">
                        <img id="${imgElementId}" class="cctv-preview" src="${loc.baseUrl}" alt="ภาพกล้องวงจรปิด">
                    </div>
                    <button class="btn-refresh" onclick="refreshCCTVImage('${imgElementId}', '${loc.baseUrl}', '${timeElementId}')">
                        🔄 รีเฟรชภาพ CCTV
                    </button>
                    <div id="${timeElementId}" class="meta-text">อัปเดตล่าสุด: ${loc.updatedAt}</div>
                </div>
            `;

            L.marker([loc.lat, loc.lng], { icon: customIcon })
                .addTo(map)
                .bindPopup(popupHtml);
        });
    </script>
</body>
</html>
