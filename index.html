<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานสถานะน้ำท่วม Real-time ทั่วประเทศ</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
        
        .info-card {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 16px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 350px; backdrop-filter: blur(5px);
        }
        .info-card h2 { margin: 0 0 4px 0; font-size: 17px; color: #0f172a; }
        .subtitle { font-size: 12px; color: #64748b; margin-bottom: 8px; }
        .badge-live { background: #16a34a; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        .status-box {
            font-size: 11px; padding: 8px; background: #f0fdf4; border: 1px solid #bbf7d0;
            border-radius: 6px; margin-bottom: 8px; font-weight: 600; color: #166534;
            display: flex; align-items: center; justify-content: space-between;
        }
        .pulse-dot {
            width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%;
            display: inline-block; animation: pulse 1.5s infinite; margin-right: 4px;
        }
        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 6px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        .search-container { margin-bottom: 8px; }
        .search-input, .select-box {
            width: 100%; padding: 7px 10px; border-radius: 6px;
            border: 1px solid #cbd5e1; font-size: 12px; outline: none; margin-bottom: 6px;
            background: #fff; font-weight: 600; color: #1e293b;
        }

        .filter-section { padding-top: 6px; border-top: 1px solid #e2e8f0; }
        .filter-title { font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px; }
        .filter-buttons { display: flex; gap: 4px; flex-wrap: wrap; }
        .btn-filter {
            flex: 1; padding: 6px 4px; border: 1px solid #cbd5e1;
            background: #f8fafc; color: #475569; border-radius: 6px;
            font-size: 10px; font-weight: 600; cursor: pointer; text-align: center; white-space: nowrap;
        }
        .btn-filter.active-flood { background: #dc2626; color: white; border-color: #dc2626; }
        .btn-filter.active-all { background: #0284c7; color: white; border-color: #0284c7; }

        .event-list { max-height: 160px; overflow-y: auto; margin-top: 8px; border-top: 1px solid #e2e8f0; padding-top: 6px; }
        .event-item { font-size: 11px; padding: 6px 0; border-bottom: 1px dashed #f1f5f9; cursor: pointer; }
        .event-item:hover { background-color: #f8fafc; }

        .popup-content { width: 240px; }
        .popup-content h3 { margin: 0 0 4px 0; font-size: 14px; color: #0f172a; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 12px; font-size: 10px; font-weight: 600; margin-bottom: 4px; }
        .cctv-preview { width: 100%; height: 130px; object-fit: cover; border-radius: 6px; margin-top: 4px; border: 1px solid #cbd5e1; background: #f1f5f9; }
        .meta-text { font-size: 10px; color: #64748b; margin-top: 4px; text-align: right; }
    </style>
</head>
<body>

    <div class="info-card">
        <h2>🌊 รายงานสถานะน้ำท่วม Real-time</h2>
        <div class="subtitle">เชื่อมต่อระบบข้อมูลสด <span class="badge-live">iTIC & Longdo Live</span></div>
        
        <div class="status-box">
            <div><span class="pulse-dot"></span> <span id="statusText">กำลังดึงข้อมูล Real-time...</span></div>
            <button onclick="loadRealtimeData()" style="font-size:10px; cursor:pointer; padding:2px 6px; background:#fff; border:1px solid #cbd5e1; border-radius:4px;">🔄 ดึงสดใหม่</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาจุดเกิดเหตุ, ถนน, อำเภอ..." oninput="onSearchChange()">
            
            <select id="provinceSelect" class="select-box" onchange="onProvinceChange()">
                <option value="ALL">📍 แสดงข้อมูลสดทุกจังหวัดทั่วประเทศ</option>
                <option value="กรุงเทพมหานคร">กรุงเทพมหานคร</option>
                <option value="สมุทรปราการ">สมุทรปราการ</option>
                <option value="นนทบุรี">นนทบุรี</option>
                <option value="ปทุมธานี">ปทุมธานี</option>
            </select>
        </div>

        <div class="filter-section">
            <div class="filter-title">ตัวกรองสภาวะ:</div>
            <div class="filter-buttons">
                <button id="btnFlood" class="btn-filter active-flood" onclick="setFilter('flood')">⚠️ เฉพาะน้ำท่วม/น้ำขัง (<span id="floodCount">0</span>)</button>
                <button id="btnAll" class="btn-filter" onclick="setFilter('all')">📍 จุดทั้งหมด (<span id="totalCount">0</span>)</button>
            </div>
        </div>

        <div id="eventContainer" class="event-list"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([13.7563, 100.5018], 7);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors | Real-time Stream'
        }).addTo(map);

        const LONGDO_API_KEY = "8df7c58d93c1a2fdcaee05f9fe3e2b93";
        
        let allRealtimeLocations = [];
        let markersLayerGroup = L.layerGroup().addTo(map);
        let markerInstances = {};
        let currentFilter = 'flood'; 
        let currentProvince = 'ALL';  
        let searchQuery = '';

        // ดึงข้อมูลสดจาก iTIC Live & Longdo API ผ่าน Proxy
        async function loadRealtimeData() {
            const statusText = document.getElementById('statusText');
            statusText.innerText = "กำลังดึงข้อมูลสด...";

            try {
                // 1. ดึงข้อมูลเหตุการณ์จราจร/ภัยพิบัติ Real-time จาก iTIC
                const iticUrl = "https://api.allorigins.win/raw?url=" + encodeURIComponent("https://live.iticfoundation.org/api/get_events.php");
                const longdoUrl = `https://api.allorigins.win/raw?url=` + encodeURIComponent(`https://api.longdo.com/traffic/json/cameras?key=${LONGDO_API_KEY}`);

                const [iticRes, longdoRes] = await Promise.allSettled([
                    fetch(iticUrl),
                    fetch(longdoUrl)
                ]);

                let fetchedData = [];

                // ประมวลผลข้อมูลจาก iTIC Live
                if (iticRes.status === 'fulfilled') {
                    const iticData = await iticRes.value.json();
                    if (Array.isArray(iticData)) {
                        iticData.forEach((ev, idx) => {
                            if (ev.lat && (ev.lng || ev.lon)) {
                                const title = ev.title || ev.description || "";
                                const isFlooded = title.includes("ท่วม") || title.includes("ขัง") || title.includes("น้ำ");
                                fetchedData.push({
                                    id: "ITIC-" + (ev.id || idx),
                                    name: ev.title || "เหตุการณ์ภัยพิบัติ/จราจร",
                                    lat: parseFloat(ev.lat),
                                    lng: parseFloat(ev.lng || ev.lon),
                                    province: ev.province || "ไม่ระบุ",
                                    isFlooded: isFlooded,
                                    details: ev.description || ev.location || "รายงานจาก iTIC Live",
                                    img: ev.image_url || "",
                                    time: ev.time || "ล่าสุด"
                                });
                            }
                        });
                    }
                }

                // ประมวลผลข้อมูลกล้องจาก Longdo
                if (longdoRes.status === 'fulfilled') {
                    const longdoData = await longdoRes.value.json();
                    if (Array.isArray(longdoData)) {
                        longdoData.forEach(cam => {
                            if (cam.lat && (cam.long || cam.lng)) {
                                fetchedData.push({
                                    id: "LONGDO-" + cam.id,
                                    name: cam.title || "กล้อง CCTV จราจร",
                                    lat: parseFloat(cam.lat),
                                    lng: parseFloat(cam.long || cam.lng),
                                    province: "กทม./ปริมณฑล",
                                    isFlooded: false, // กล้องทั่วไป
                                    details: "กล้องส่องสภาพจราจรสด",
                                    img: cam.url || cam.image || "",
                                    time: "สดจากกล้อง"
                                });
                            }
                        });
                    }
                }

                if (fetchedData.length > 0) {
                    allRealtimeLocations = fetchedData;
                    statusText.innerText = `เชื่อมต่อสดสำเร็จ! (${allRealtimeLocations.length} จุด)`;
                    renderMap();
                } else {
                    throw new Error("Empty data");
                }

            } catch (error) {
                console.warn("ไม่สามารถดึงข้อมูลสดผ่าน Proxy ได้:", error);
                statusText.innerText = "ดึงข้อมูลสดไม่สำเร็จ (โปรดตรวจสอบการเชื่อมต่ออินเทอร์เน็ต)";
            }
        }

        function focusLocation(lat, lng, locId) {
            map.flyTo([lat, lng], 14, { duration: 1.2 });
            if (markerInstances[locId]) {
                markerInstances[locId].openPopup();
            }
        }

        function renderMap() {
            markersLayerGroup.clearLayers();
            markerInstances = {};
            const eventContainer = document.getElementById('eventContainer');
            eventContainer.innerHTML = '';

            let floodCnt = 0;
            let totalCnt = 0;
            let bounds = [];

            allRealtimeLocations.forEach(loc => {
                if (isNaN(loc.lat) || isNaN(loc.lng)) return;
                if (currentProvince !== 'ALL' && !loc.province.includes(currentProvince)) return;
                
                const searchTxt = (loc.name + loc.details + loc.province).toLowerCase();
                if (searchQuery && !searchTxt.includes(searchQuery.toLowerCase())) return;

                totalCnt++;
                if (loc.isFlooded) floodCnt++;

                // กรองเฉพาะจุดน้ำท่วม
                if (currentFilter === 'flood' && !loc.isFlooded) return;

                bounds.push([loc.lat, loc.lng]);

                const colorClass = loc.isFlooded ? '#dc2626' : '#0284c7';
                const customIcon = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color: ${colorClass}; width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.4);"></div>`,
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });

                const popupHtml = `
                    <div class="popup-content">
                        <h3>${loc.isFlooded ? '⚠️' : '📹'} ${loc.name}</h3>
                        <span class="badge" style="${loc.isFlooded ? 'background:#fee2e2; color:#991b1b;' : 'background:#e0f2fe; color:#0369a1;'}">
                            ${loc.isFlooded ? '⚠️ พบสภาวะน้ำท่วม/ขัง' : '📷 จุดตรวจเช็ก CCTV'}
                        </span>
                        <br>
                        <small><b>รายละเอียด:</b> ${loc.details}</small>
                        ${loc.img ? `<img class="cctv-preview" src="${loc.img}" alt="ภาพสด">` : ''}
                        <div class="meta-text">⏰ อัปเดต: ${loc.time}</div>
                    </div>
                `;

                const marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).bindPopup(popupHtml);
                markersLayerGroup.addLayer(marker);
                markerInstances[loc.id] = marker;

                const item = document.createElement('div');
                item.className = 'event-item';
                item.onclick = () => focusLocation(loc.lat, loc.lng, loc.id);
                item.innerHTML = `
                    <div style="color: ${loc.isFlooded ? '#dc2626' : '#0284c7'}; font-weight:bold;">
                        ${loc.isFlooded ? '⚠️' : '📷'} ${loc.name}
                    </div>
                    <div style="color:#64748b; font-size:10px;">${loc.details}</div>
                `;
                eventContainer.appendChild(item);
            });

            document.getElementById('floodCount').innerText = floodCnt;
            document.getElementById('totalCount').innerText = totalCnt;

            if (eventContainer.children.length === 0) {
                eventContainer.innerHTML = '<div style="font-size:11px; color:#64748b;">ไม่พบเหตุการณ์ในเงื่อนไขการค้นหานี้</div>';
            }

            if (bounds.length > 0 && !searchQuery) {
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
            }
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            document.getElementById('btnFlood').className = `btn-filter ${filterType === 'flood' ? 'active-flood' : ''}`;
            document.getElementById('btnAll').className = `btn-filter ${filterType === 'all' ? 'active-all' : ''}`;
            renderMap();
        }

        function onProvinceChange() {
            currentProvince = document.getElementById('provinceSelect').value;
            renderMap();
        }

        function onSearchChange() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderMap();
        }

        // เริ่มต้นโหลดข้อมูล Real-time ทันที
        loadRealtimeData();

        // Auto refresh ทุก 2 นาที
        setInterval(loadRealtimeData, 120000);
    </script>
</body>
</html>
