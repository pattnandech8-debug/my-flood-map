<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานสถานะ CCTV น้ำท่วม กทม. & ปริมณฑล (Longdo API)</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
        
        .info-card {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 16px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 340px; backdrop-filter: blur(5px);
        }
        .info-card h2 { margin: 0 0 4px 0; font-size: 17px; color: #0f172a; }
        .subtitle { font-size: 12px; color: #64748b; margin-bottom: 8px; }
        .badge-api { background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        /* Search Box */
        .search-container { margin-bottom: 8px; }
        .search-input {
            width: 100%; padding: 7px 10px; border-radius: 6px;
            border: 1px solid #cbd5e1; font-size: 12px; outline: none;
        }

        /* Status Header */
        .status-box {
            font-size: 11px; color: #334155; padding: 6px; background: #f1f5f9;
            border-radius: 6px; margin-bottom: 8px; text-align: center; font-weight: 600;
        }

        /* Sidebar List */
        .event-list { max-height: 180px; overflow-y: auto; margin-top: 8px; border-top: 1px solid #e2e8f0; padding-top: 6px; }
        .event-item { font-size: 11px; padding: 6px 0; border-bottom: 1px dashed #f1f5f9; cursor: pointer; }
        .event-item:hover { background-color: #f8fafc; }
        .event-title { font-weight: 600; color: #0284c7; }

        /* Popup Styling */
        .popup-content { width: 250px; }
        .popup-content h3 { margin: 0 0 4px 0; font-size: 14px; color: #0f172a; }
        .cctv-preview { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-top: 6px; border: 1px solid #cbd5e1; background: #f1f5f9; }
        .btn-refresh { width: 100%; margin-top: 6px; padding: 5px; background: #0284c7; color: white; border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; }
    </style>
</head>
<body>

    <div class="info-card">
        <h2>📷 กล้อง CCTV กทม. & ปริมณฑล</h2>
        <div class="subtitle">เชื่อมต่อข้อมูลสดผ่าน <span class="badge-api">Longdo Traffic API</span></div>
        
        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาชื่อจุดกล้อง หรือ ถนน..." oninput="onSearchChange()">
        </div>

        <div id="statusBox" class="status-box">⏳ กำลังโหลดข้อมูลกล้อง CCTV จาก Longdo...</div>

        <div id="eventContainer" class="event-list"></div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. ตั้งค่าแผนที่เริ่มต้นที่กรุงเทพฯ
        const map = L.map('map').setView([13.7563, 100.5018], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors | Data by Longdo'
        }).addTo(map);

        // 🔑 ใส่ Longdo API Key ของคุณตรงนี้ (สมัครขอ Key ฟรีได้ที่ https://map.longdo.com/api/)
        const LONGDO_API_KEY = "YOUR_LONGDO_API_KEY"; 

        let allCCTVData = [];
        let markersLayerGroup = L.layerGroup().addTo(map);
        let markerInstances = {};
        let searchQuery = '';

        // 2. ฟังก์ชันดึงข้อมูลกล้องวงจรปิดทั้งหมดจาก Longdo Traffic API
        async function fetchLongdoCCTV() {
            const statusBox = document.getElementById('statusBox');
            
            // หากยังไม่ได้ใส่ API Key จริง ให้ใช้ Mock API / Proxy ในการดึง Feed
            const apiUrl = `https://api.longdo.com/traffic/json/cameras?key=${LONGDO_API_KEY}`;
            
            try {
                // ใช้ CORS Proxy เพื่อหลีกเลี่ยงการโดนบล็อกในเบราว์เซอร์
                const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`);
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    allCCTVData = data;
                    statusBox.innerText = `✅ โหลดสำเร็จ! พบกล้องทั้งหมด ${allCCTVData.length} จุด`;
                    renderMap();
                } else {
                    // หาก API Key ไม่สมบูรณ์ ให้สลับมาใช้ข้อมูลสำรอง
                    loadFallbackData();
                }
            } catch (error) {
                console.warn("ไม่สามารถดึงข้อมูลตรงจาก Longdo API ได้ กำลังเปิดโหมดสำรอง:", error);
                loadFallbackData();
            }
        }

        // โหมดข้อมูลสำรองในกรณีไม่ได้ใส่ API Key
        function loadFallbackData() {
            document.getElementById('statusBox').innerText = `⚠️ แสดงข้อมูลกล้องตัวอย่าง (กรุณาใส่ API Key จริง)`;
            allCCTVData = [
                { id: "C01", title: "แยกรัชดา-ลาดพร้าว", lat: 13.8062, long: 100.5739, url: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=500&q=80" },
                { id: "C02", title: "แยกสำโรง (สุขุมวิท)", lat: 13.6582, long: 100.5962, url: "https://images.unsplash.com/photo-1508873696983-2df515122519?w=500&q=80" },
                { id: "C03", title: "ห้าแยกปากเกร็ด", lat: 13.9075, long: 100.4988, url: "https://images.unsplash.com/photo-1506521781263-d8422e82f27a?w=500&q=80" },
                { id: "C04", title: "ตลาดรังสิต (พหลโยธิน)", lat: 13.9872, long: 100.6151, url: "https://images.unsplash.com/photo-1449824913935-59a10b8d2000?w=500&q=80" }
            ];
            renderMap();
        }

        function refreshImage(imgId, baseUrl) {
            const imgEl = document.getElementById(imgId);
            if (imgEl) {
                const ts = new Date().getTime();
                const sep = baseUrl.includes('?') ? '&' : '?';
                imgEl.src = `${baseUrl}${sep}_t=${ts}`;
            }
        }

        function focusLocation(lat, lng, locId) {
            map.flyTo([lat, lng], 15, { duration: 1.2 });
            if (markerInstances[locId]) {
                markerInstances[locId].openPopup();
            }
        }

        // 3. ฟังก์ชันปักหมุดกล้องทั้งหมดลงบนแผนที่
        function renderMap() {
            markersLayerGroup.clearLayers();
            markerInstances = {};
            const eventContainer = document.getElementById('eventContainer');
            eventContainer.innerHTML = '';

            let bounds = [];

            allCCTVData.forEach(cam => {
                const title = cam.title || cam.name || "กล้อง CCTV จราจร";
                const lat = parseFloat(cam.lat);
                const lng = parseFloat(cam.long || cam.lng);
                const imgUrl = cam.url || cam.image || "";

                if (isNaN(lat) || isNaN(lng)) return;
                if (searchQuery && !title.toLowerCase().includes(searchQuery.toLowerCase())) return;

                bounds.push([lat, lng]);

                // ไอคอนหมุดสีฟ้าสำหรับกล้อง CCTV
                const customIcon = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color: #0284c7; width: 16px; height: 16px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.3);"></div>`,
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                const imgId = `img-${cam.id}`;
                const popupHtml = `
                    <div class="popup-content">
                        <h3>📹 ${title}</h3>
                        <img id="${imgId}" class="cctv-preview" src="${imgUrl}" alt="ภาพสด CCTV">
                        <button class="btn-refresh" onclick="refreshImage('${imgId}', '${imgUrl}')">🔄 ดึงภาพสดใหม่</button>
                    </div>
                `;

                const marker = L.marker([lat, lng], { icon: customIcon }).bindPopup(popupHtml);
                marker.on('popupopen', () => refreshImage(imgId, imgUrl));
                markersLayerGroup.addLayer(marker);
                markerInstances[cam.id] = marker;

                // เพิ่มลงรายการแถบข้าง
                const item = document.createElement('div');
                item.className = 'event-item';
                item.onclick = () => focusLocation(lat, lng, cam.id);
                item.innerHTML = `<div class="event-title">📷 ${title}</div>`;
                eventContainer.appendChild(item);
            });

            if (bounds.length > 0 && !searchQuery) {
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
            }
        }

        function onSearchChange() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderMap();
        }

        // เริ่มต้นดึงข้อมูลเมื่อโหลดหน้าเว็บ
        fetchLongdoCCTV();
    </script>
</body>
</html>
