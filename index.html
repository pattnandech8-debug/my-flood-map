<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานสถานะน้ำท่วม (Gemini AI Analysis)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
        
        .info-card {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 16px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 340px; backdrop-filter: blur(5px);
        }
        .info-card h2 { margin: 0 0 4px 0; font-size: 17px; color: #0f172a; }
        .subtitle { font-size: 12px; color: #64748b; margin-bottom: 8px; }
        .badge-gemini { background: #7c3aed; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        .status-box {
            font-size: 11px; padding: 6px; background: #f1f5f9;
            border-radius: 6px; margin-bottom: 8px; text-align: center; font-weight: 600; color: #334155;
        }

        .search-container { margin-bottom: 8px; }
        .search-input {
            width: 100%; padding: 7px 10px; border-radius: 6px;
            border: 1px solid #cbd5e1; font-size: 12px; outline: none;
        }

        .camera-list { max-height: 180px; overflow-y: auto; margin-top: 8px; border-top: 1px solid #e2e8f0; padding-top: 6px; }
        .camera-item { font-size: 11px; padding: 6px 0; border-bottom: 1px dashed #f1f5f9; cursor: pointer; color: #0369a1; }
        .camera-item:hover { background-color: #f0f9ff; font-weight: bold; }

        .popup-content { width: 250px; }
        .popup-content h3 { margin: 0 0 4px 0; font-size: 14px; color: #0f172a; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 12px; font-size: 10px; font-weight: 600; margin-bottom: 4px; }
        .badge-normal { background-color: #dcfce7; color: #166534; }
        .badge-flooded { background-color: #fee2e2; color: #991b1b; }
        .cctv-preview { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-top: 6px; border: 1px solid #cbd5e1; background: #f1f5f9; display: block; }
    </style>
</head>
<body>

    <div class="info-card">
        <h2>📷 รายงานน้ำท่วม CCTV</h2>
        <div class="subtitle">วิเคราะห์ภาพโดย <span class="badge-gemini">Gemini AI</span></div>
        
        <div id="statusBox" class="status-box">⏳ กำลังโหลดไฟล์ flood_data.json...</div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาชื่อจุดกล้อง หรือ ถนน..." oninput="onSearchChange()">
        </div>

        <div id="cameraContainer" class="camera-list"></div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([13.7563, 100.5018], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        let allCameras = [];
        let markersLayerGroup = L.layerGroup().addTo(map);
        let markerInstances = {};
        let searchQuery = '';

        async function loadJSONData() {
            const statusBox = document.getElementById('statusBox');
            try {
                // ดึงไฟล์ flood_data.json ที่ได้จากสคริปต์ Python
                const response = await fetch('flood_data.json?_t=' + new Date().getTime());
                if (!response.ok) throw new Error("File not found");
                
                allCameras = await response.json();
                statusBox.innerText = `✅ โหลดสำเร็จ! พบทั้งหมด ${allCameras.length} จุด`;
                renderMap();
            } catch (error) {
                statusBox.innerText = "⚠️️ ยังไม่มีไฟล์ flood_data.json (กรุณารัน python analyze.py แล้วอัปโหลดไฟล์ขึ้น GitHub)";
            }
        }

        function focusLocation(lat, lng, locId) {
            map.flyTo([lat, lng], 15, { duration: 1.2 });
            if (markerInstances[locId]) {
                markerInstances[locId].openPopup();
            }
        }

        function renderMap() {
            markersLayerGroup.clearLayers();
            markerInstances = {};
            const cameraContainer = document.getElementById('cameraContainer');
            cameraContainer.innerHTML = '';

            let bounds = [];

            allCameras.forEach(cam => {
                const title = cam.name || "กล้อง CCTV จราจร";
                const lat = parseFloat(cam.lat);
                const lng = parseFloat(cam.lng);
                const isFlooded = cam.isFlooded === true;

                if (isNaN(lat) || isNaN(lng)) return;
                if (searchQuery && !title.toLowerCase().includes(searchQuery.toLowerCase())) return;

                bounds.push([lat, lng]);

                const colorClass = isFlooded ? '#dc2626' : '#22c55e';
                const customIcon = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color: ${colorClass}; width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.3);"></div>`,
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });

                const popupHtml = `
                    <div class="popup-content">
                        <h3>📹 ${title}</h3>
                        <span class="badge ${isFlooded ? 'badge-flooded' : 'badge-normal'}">
                            ${isFlooded ? '⚠️ พบน้ำท่วมขัง' : '✅ ปกติ'}
                        </span>
                        <br>
                        <small><b>AI วิเคราะห์:</b> ${cam.waterLevel || 'ไม่มีข้อมูล'}</small>
                        <img class="cctv-preview" src="${cam.baseUrl}" alt="ภาพสด">
                    </div>
                `;

                const marker = L.marker([lat, lng], { icon: customIcon }).bindPopup(popupHtml);
                markersLayerGroup.addLayer(marker);
                markerInstances[cam.id] = marker;

                const item = document.createElement('div');
                item.className = 'camera-item';
                item.onclick = () => focusLocation(lat, lng, cam.id);
                item.innerHTML = `${isFlooded ? '⚠️' : '🟢'} ${title}`;
                cameraContainer.appendChild(item);
            });

            if (bounds.length > 0 && !searchQuery) {
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
            }
        }

        function onSearchChange() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderMap();
        }

        loadJSONData();
    </script>
</body>
</html>
