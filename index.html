<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบรายงานสถานะน้ำท่วม กทม. & ปริมณฑล (Longdo + AI Analysis)</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
        
        .info-card {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 16px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 340px; backdrop-filter: blur(5px);
        }
        .info-card h2 { margin: 0 0 4px 0; font-size: 17px; color: #0f172a; }
        .subtitle { font-size: 12px; color: #64748b; margin-bottom: 8px; }
        .badge-longdo { background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .badge-gemini { background: #7c3aed; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        /* Status Box */
        .status-box {
            font-size: 11px; padding: 6px; background: #f1f5f9;
            border-radius: 6px; margin-bottom: 8px; text-align: center; font-weight: 600; color: #334155;
        }

        /* Search Box */
        .search-container { margin-bottom: 8px; }
        .search-input {
            width: 100%; padding: 7px 10px; border-radius: 6px;
            border: 1px solid #cbd5e1; font-size: 12px; outline: none;
        }
        .search-input:focus { border-color: #0284c7; box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15); }

        /* Filter Section */
        .filter-section { padding-top: 8px; border-top: 1px solid #e2e8f0; }
        .filter-title { font-size: 11px; font-weight: 600; color: #334155; margin-bottom: 4px; }
        .select-province {
            width: 100%; padding: 6px 10px; border-radius: 6px;
            border: 1px solid #cbd5e1; font-size: 12px; background: #fff;
            color: #1e293b; font-weight: 600; margin-bottom: 8px; cursor: pointer;
        }
        .filter-buttons { display: flex; gap: 6px; flex-wrap: wrap; }
        .btn-filter {
            flex: 1; padding: 6px 6px; border: 1px solid #cbd5e1;
            background: #f8fafc; color: #475569; border-radius: 6px;
            font-size: 11px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; text-align: center; white-space: nowrap;
        }
        .btn-filter:hover { background: #f1f5f9; }
        .btn-filter.active { background: #0284c7; color: white; border-color: #0284c7; }
        .btn-filter.active-flood { background: #dc2626; color: white; border-color: #dc2626; }

        /* Event Sidebar List */
        .event-list { max-height: 140px; overflow-y: auto; margin-top: 8px; border-top: 1px solid #e2e8f0; padding-top: 6px; }
        .event-item { font-size: 11px; padding: 5px 0; border-bottom: 1px dashed #f1f5f9; cursor: pointer; }
        .event-item:hover { background-color: #f8fafc; }
        .event-title { font-weight: 600; }

        /* Popup Content */
        .popup-content { width: 240px; }
        .popup-content h3 { margin: 0 0 4px 0; font-size: 14px; color: #0f172a; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 12px; font-size: 10px; font-weight: 600; margin-bottom: 4px; }
        .badge-normal { background-color: #dcfce7; color: #166534; }
        .badge-flooded { background-color: #fee2e2; color: #991b1b; }
        .severity-tag { font-size: 11px; font-weight: bold; color: #c2410c; }
        .cctv-preview { width: 100%; height: 125px; object-fit: cover; border-radius: 6px; margin-top: 4px; border: 1px solid #cbd5e1; background: #f1f5f9; }
        .btn-refresh { width: 100%; margin-top: 6px; padding: 5px; background: #0284c7; color: white; border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .meta-text { font-size: 10px; color: #64748b; margin-top: 4px; text-align: right; }
    </style>
</head>
<body>

    <div class="info-card">
        <h2>🌊 รายงานน้ำท่วม กทม. & ปริมณฑล</h2>
        <div class="subtitle">กล้องจาก <span class="badge-longdo">Longdo API</span> + วิเคราะห์โดย <span class="badge-gemini">Gemini AI</span></div>
        
        <div id="statusBox" class="status-box">⏳ กำลังเชื่อมต่อข้อมูลกล้อง CCTV...</div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาชื่อจุด หรือ ถนน..." oninput="onSearchChange()">
        </div>

        <div class="filter-section">
            <div class="filter-title">เลือกพื้นที่จังหวัด:</div>
            <select id="provinceSelect" class="select-province" onchange="onProvinceChange()">
                <option value="ALL">📍 ทุกพื้นที่ (กทม. + ปริมณฑล)</option>
                <option value="BKK">🏢 กรุงเทพมหานคร</option>
                <option value="SPK">🏭 สมุทรปราการ</option>
                <option value="NBT">🛶 นนทบุรี</option>
                <option value="PTE">🌾 ปทุมธานี</option>
            </select>

            <div class="filter-title">สถานะน้ำท่วม:</div>
            <div class="filter-buttons">
                <button id="btnFlood" class="btn-filter active-flood" onclick="setFilter('flood')">🌊 เฉพาะท่วม (<span id="floodCount">0</span>)</button>
                <button id="btnNormal" class="btn-filter" onclick="setFilter('normal')">🟢 ปกติ (<span id="normalCount">0</span>)</button>
                <button id="btnAll" class="btn-filter" onclick="setFilter('all')">📍 ทั้งหมด (<span id="totalCount">0</span>)</button>
            </div>
        </div>

        <div id="eventContainer" class="event-list"></div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([13.7563, 100.5018], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors | Data by Longdo API'
        }).addTo(map);

        // 🔑 ใส่ Longdo API Key ที่ให้ไว้เรียบร้อยแล้ว
        const LONGDO_API_KEY = "8df7c58d93c1a2fdcaee05f9fe3e2b93";

        let cctvLocations = [];
        let markersLayerGroup = L.layerGroup().addTo(map);
        let markerInstances = {};
        let currentFilter = 'flood'; 
        let currentProvince = 'ALL';  
        let searchQuery = '';

        // 1. ดึงข้อมูลจากไฟล์ flood_data.json หรือดึงตรงจาก Longdo API
        async function loadCCTVData() {
            const statusBox = document.getElementById('statusBox');
            
            // ลองดึงไฟล์ flood_data.json ที่ผ่านการวิเคราะห์ AI ก่อน
            try {
                const response = await fetch('flood_data.json?_t=' + new Date().getTime());
                if (response.ok) {
                    cctvLocations = await response.json();
                    statusBox.innerText = `🤖 ดึงข้อมูลวิเคราะห์ AI สดสำเร็จ! พบ ${cctvLocations.length} จุด`;
                    renderMap();
                    return;
                }
            } catch (e) {
                console.log("ยังไม่มีไฟล์ flood_data.json สลับไปดึงกล้องสดจาก Longdo API Direct...");
            }

            // หากยังไม่มีไฟล์ flood_data.json ให้ดึงสดจาก Longdo Traffic API ด้วย Key นี้
            const apiUrl = `https://api.longdo.com/traffic/json/cameras?key=${LONGDO_API_KEY}`;
            try {
                const response = await fetch(`https://corsproxy.io/?${encodeURIComponent(apiUrl)}`);
                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    cctvLocations = data.map(cam => ({
                        id: cam.id || Math.random().toString(),
                        name: cam.title || cam.name || "กล้อง CCTV จราจร",
                        lat: parseFloat(cam.lat),
                        lng: parseFloat(cam.long || cam.lng),
                        baseUrl: cam.url || cam.image || "",
                        isFlooded: false, // ค่าเริ่มต้นถ้ายังไม่ผ่าน AI
                        severity: "ปกติ",
                        waterLevel: "การจราจรทั่วไป (รอประมวลผล AI)",
                        updatedAt: "สดจาก Longdo"
                    }));
                    statusBox.innerText = `✅ เชื่อมต่อ Longdo API สดสำเร็จ! พบกล้อง ${cctvLocations.length} จุด`;
                    renderMap();
                } else {
                    loadFallbackData();
                }
            } catch (error) {
                console.warn("เกิดข้อผิดพลาดในการโหลด API:", error);
                loadFallbackData();
            }
        }

        function loadFallbackData() {
            document.getElementById('statusBox').innerText = `⚠️ แสดงข้อมูลตัวอย่างชั่วคราว`;
            cctvLocations = [
                { id: "M01", name: "แยกรัชดา-ลาดพร้าว", lat: 13.8062, lng: 100.5739, baseUrl: "https://images.unsplash.com/photo-1544620347-c4fd4a3d5957?w=500&q=80", isFlooded: true, severity: "สูง", waterLevel: "พบน้ำท่วมขังสูงเสมอฟุตบาท", updatedAt: "15:30 น." },
                { id: "M02", name: "ถนนเทพารักษ์ (แยกศรีเทพา)", lat: 13.6338, lng: 100.6273, baseUrl: "https://images.unsplash.com/photo-1508873696983-2df515122519?w=500&q=80", isFlooded: true, severity: "ปานกลาง", waterLevel: "พบน้ำขังนิ่งประมาณ 10 ซม.", updatedAt: "15:28 น." },
                { id: "M03", name: "แยกอโศกมนตรี", lat: 13.7370, lng: 100.5604, baseUrl: "https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=500&q=80", isFlooded: false, severity: "ไม่มี", waterLevel: "สภาพถนนแห้งปกติ", updatedAt: "15:25 น." }
            ];
            renderMap();
        }

        function refreshImage(imgId, baseUrl) {
            const imgEl = document.getElementById(imgId);
            if (imgEl && baseUrl) {
                const ts = new Date().getTime();
                const sep = baseUrl.includes('?') ? '&' : '?';
                imgEl.src = `${baseUrl}${sep}_t=${ts}`;
            }
        }

        function focusLocation(lat, lng, locId) {
            map.flyTo([lat, lng], 15, { duration: 1.2 });
            if (markerInstances[locId]) {
                markerInstances[locId].openPopup();
            }
        }

        function renderMap() {
            markersLayerGroup.clearLayers();
            markerInstances = {};
            const eventContainer = document.getElementById('eventContainer');
            eventContainer.innerHTML = '';

            let floodCnt = 0;
            let normalCnt = 0;
            let totalCnt = 0;
            let bounds = [];

            cctvLocations.forEach(loc => {
                const name = loc.name || "จุดตรวจเช็ก CCTV";
                const isFlooded = loc.isFlooded === true || loc.isFlooded === "true";
                const severity = loc.severity || "ไม่ระบุ";
                const waterDesc = loc.waterLevel || loc.description || "ไม่มีข้อมูล";

                if (isNaN(loc.lat) || isNaN(loc.lng)) return;
                if (searchQuery && !name.toLowerCase().includes(searchQuery.toLowerCase())) return;

                totalCnt++;
                if (isFlooded) floodCnt++;
                else normalCnt++;

                if (currentFilter === 'flood' && !isFlooded) return;
                if (currentFilter === 'normal' && isFlooded) return;

                bounds.push([loc.lat, loc.lng]);

                const colorClass = isFlooded ? '#dc2626' : '#22c55e';
                const customIcon = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color: ${colorClass}; width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.3);"></div>`,
                    iconSize: [18, 18],
                    iconAnchor: [9, 9]
                });

                const imgId = `img-${loc.id}`;
                const popupHtml = `
                    <div class="popup-content">
                        <h3>📹 ${name}</h3>
                        <span class="badge ${isFlooded ? 'badge-flooded' : 'badge-normal'}">
                            ${isFlooded ? '⚠️ พบน้ำท่วมขัง' : '✅ ปกติ'}
                        </span>
                        ${isFlooded ? `<span class="severity-tag">ระดับ: ${severity}</span>` : ''}
                        <br>
                        <small><b>สถานะ:</b> ${waterDesc}</small>
                        <img id="${imgId}" class="cctv-preview" src="${loc.baseUrl}" alt="ภาพ CCTV">
                        <button class="btn-refresh" onclick="refreshImage('${imgId}', '${loc.baseUrl}')">🔄 ดึงภาพสดใหม่</button>
                        <div class="meta-text">อัปเดต: ${loc.updatedAt || 'ล่าสุด'}</div>
                    </div>
                `;

                const marker = L.marker([loc.lat, loc.lng], { icon: customIcon }).bindPopup(popupHtml);
                marker.on('popupopen', () => refreshImage(imgId, loc.baseUrl));
                markersLayerGroup.addLayer(marker);
                markerInstances[loc.id] = marker;

                const item = document.createElement('div');
                item.className = 'event-item';
                item.onclick = () => focusLocation(loc.lat, loc.lng, loc.id);
                item.innerHTML = `
                    <div class="event-title" style="color: ${isFlooded ? '#dc2626' : '#166534'}">
                        ${isFlooded ? '⚠️' : '🟢'} ${name}
                    </div>
                    <div style="color:#64748b;">${waterDesc}</div>
                `;
                eventContainer.appendChild(item);
            });

            document.getElementById('floodCount').innerText = floodCnt;
            document.getElementById('normalCount').innerText = normalCnt;
            document.getElementById('totalCount').innerText = totalCnt;

            if (eventContainer.children.length === 0) {
                eventContainer.innerHTML = '<div style="font-size:11px; color:#64748b;">ไม่พบรายการตรงกับเงื่อนไขในตัวกรองนี้</div>';
            }

            if (bounds.length > 0 && !searchQuery) {
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
            }
        }

        function setFilter(filterType) {
            currentFilter = filterType;
            document.getElementById('btnFlood').className = `btn-filter ${filterType === 'flood' ? 'active-flood' : ''}`;
            document.getElementById('btnNormal').className = `btn-filter ${filterType === 'normal' ? 'active' : ''}`;
            document.getElementById('btnAll').className = `btn-filter ${filterType === 'all' ? 'active' : ''}`;
            renderMap();
        }

        function onProvinceChange() {
            currentProvince = document.getElementById('provinceSelect').value;
            renderMap();
        }

        function onSearchChange() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderMap();
        }

        loadCCTVData();
    </script>
</body>
</html>
