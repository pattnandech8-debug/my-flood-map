<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายงานน้ำท่วม กทม. Real-time (iTIC Data)</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
        
        .info-card {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 16px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 320px; backdrop-filter: blur(5px);
        }
        .info-card h2 { margin: 0 0 6px 0; font-size: 16px; color: #0f172a; }
        
        /* แผงรายการเหตุการณ์ล่าสุด */
        .event-list {
            max-height: 180px; overflow-y: auto; margin-top: 10px;
            border-top: 1px solid #e2e8f0; padding-top: 8px;
        }
        .event-item {
            font-size: 12px; padding: 6px 0; border-bottom: 1px dashed #f1f5f9;
        }
        .event-title { font-weight: 600; color: #dc2626; }
        .event-time { font-size: 10px; color: #64748b; }

        .badge-itic {
            background: #2563eb; color: white; padding: 2px 6px;
            border-radius: 4px; font-size: 10px; font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="info-card">
        <h2>🌊 สถิติ & เหตุการณ์น้ำท่วม กทม.</h2>
        <span class="badge-itic">อ้างอิงข้อมูล: iTIC Foundation</span>
        
        <div id="eventContainer" class="event-list">
            <div style="font-size: 12px; color: #64748b;">กำลังโหลดเหตุการณ์ล่าสุด...</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([13.7563, 100.5018], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18 }).addTo(map);

        // ตัวอย่างโครงสร้างข้อมูลเหตุการณ์น้ำท่วมที่ดึงมาจาก iTIC Live Data Feed
        const iticFloodEvents = [
            {
                id: "ITIC-801",
                title: "น้ำท่วมขังผิวจราจร",
                location: "ถนนรัชดาภิเษก (หน้าแยกลาดพร้าว)",
                lat: 13.8062,
                lng: 100.5739,
                severity: "สูง (ขังเกิน 15 ซม.)",
                updated: "15:02 น.",
                cctvUrl: "https://live.iticfoundation.org/assets/img/logo.png" // เปลี่ยนเป็น URL สแนปช็อตกล้องจริง
            },
            {
                id: "ITIC-802",
                title: "เร่งระบายน้ำ",
                location: "ถนนพัฒนาการ (ช่วงคลองลาว)",
                lat: 13.7336,
                lng: 100.6461,
                severity: "ปานกลาง",
                updated: "14:55 น.",
                cctvUrl: "https://live.iticfoundation.org/assets/img/logo.png"
            }
        ];

        function renderEvents() {
            const container = document.getElementById('eventContainer');
            container.innerHTML = '';

            iticFloodEvents.forEach(ev => {
                // 1. เพิ่มในรายการแถบข้าง
                const item = document.createElement('div');
                item.className = 'event-item';
                item.innerHTML = `
                    <div class="event-title">⚠️ ${ev.title}</div>
                    <div>${ev.location}</div>
                    <div class="event-time">ระดับ: ${ev.severity} | ${ev.updated}</div>
                `;
                container.appendChild(item);

                // 2. ปักหมุดบนแผนที่
                const customIcon = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color: #dc2626; width: 18px; height: 18px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.3);"></div>`,
                    iconSize: [18, 18]
                });

                L.marker([ev.lat, ev.lng], { icon: customIcon })
                    .addTo(map)
                    .bindPopup(`
                        <b>⚠️ ${ev.title}</b><br>
                        <b>จุดเกิดเหตุ:</b> ${ev.location}<br>
                        <b>ระดับน้ำ:</b> ${ev.severity}<br>
                        <small>อัปเดตเมื่อ: ${ev.updated}</small>
                    `);
            });
        }

        renderEvents();
    </script>
</body>
</html>
