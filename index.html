<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กล้อง CCTV จราจร Real-time ทั่ว กทม. & ปริมณฑล (Longdo Map API)</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        * { box-sizing: border-box; font-family: 'Sarabun', sans-serif; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100vh; width: 100vw; }
        
        .info-card {
            position: absolute; top: 15px; left: 15px; z-index: 1000;
            background: rgba(255, 255, 255, 0.95); padding: 16px;
            border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            max-width: 340px; backdrop-filter: blur(5px);
        }
        .info-card h2 { margin: 0 0 4px 0; font-size: 17px; color: #0f172a; }
        .subtitle { font-size: 12px; color: #64748b; margin-bottom: 8px; }
        .badge-api { background: #0284c7; color: white; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }

        /* Status Box */
        .status-box {
            font-size: 11px; padding: 6px 10px; background: #e0f2fe; border: 1px solid #bae6fd;
            border-radius: 6px; margin-bottom: 8px; font-weight: 600; color: #0369a1;
            display: flex; align-items: center; justify-content: space-between;
        }

        /* Search Box */
        .search-container { margin-bottom: 8px; }
        .search-input {
            width: 100%; padding: 8px 10px; border-radius: 6px;
            border: 1px solid #cbd5e1; font-size: 12px; outline: none;
        }
        .search-input:focus { border-color: #0284c7; box-shadow: 0 0 0 2px rgba(2, 132, 199, 0.15); }

        /* Sidebar Camera List */
        .camera-list { max-height: 180px; overflow-y: auto; margin-top: 8px; border-top: 1px solid #e2e8f0; padding-top: 6px; }
        .camera-item { font-size: 11px; padding: 6px 0; border-bottom: 1px dashed #f1f5f9; cursor: pointer; color: #0369a1; }
        .camera-item:hover { background-color: #f0f9ff; font-weight: bold; }

        /* Popup Styling */
        .popup-content { width: 250px; }
        .popup-content h3 { margin: 0 0 4px 0; font-size: 14px; color: #0f172a; }
        .cctv-preview { width: 100%; height: 140px; object-fit: cover; border-radius: 6px; margin-top: 6px; border: 1px solid #cbd5e1; background: #f1f5f9; display: block; }
        .btn-refresh { width: 100%; margin-top: 6px; padding: 6px; background: #0284c7; color: white; border: none; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; }
        .btn-refresh:hover { background-color: #0369a1; }
    </style>
</head>
<body>

    <div class="info-card">
        <h2>📷 กล้อง CCTV จราจร Real-time</h2>
        <div class="subtitle">เชื่อมต่อฐานข้อมูลสดผ่าน <span class="badge-api">Longdo Map API</span></div>
        
        <div class="status-box">
            <span id="statusText">⏳ กำลังดึงจุดกล้องจาก Longdo...</span>
            <button onclick="fetchLongdoCameras()" style="font-size:10px; cursor:pointer; padding:2px 5px; border:1px solid #0284c7; background:#fff; color:#0284c7; border-radius:4px;">🔄 ดึงใหม่</button>
        </div>

        <div class="search-container">
            <input type="text" id="searchInput" class="search-input" placeholder="🔍 ค้นหาชื่อจุดกล้อง หรือ ถนน..." oninput="onSearchChange()">
        </div>

        <div id="cameraContainer" class="camera-list"></div>
    </div>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // 1. ตั้งพิกัดกึ่งกลางที่กรุงเทพฯ
        const map = L.map('map').setView([13.7563, 100.5018], 11);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '© OpenStreetMap contributors | Data by Longdo Map API'
        }).addTo(map);

        // API Key ของคุณ
        const LONGDO_API_KEY = "8df7c58d93c1a2fdcaee05f9fe3e2b93";

        let allCameras = [];
        let markersLayerGroup = L.layerGroup().addTo(map);
        let markerInstances = {};
        let searchQuery = '';

        // 2. ดึงข้อมูลกล้อง CCTV ทั้งหมดจาก Longdo Traffic API ผ่าน Proxy แก้ CORS
        async function fetchLongdoCameras() {
            const statusText = document.getElementById('statusText');
            statusText.innerText = "⏳ กำลังดึงกล้องสดจาก Longdo...";

            const targetUrl = `https://api.longdo.com/traffic/json/cameras?key=${LONGDO_API_KEY}`;
            // ใช้ proxy ของ allorigins เพื่อทะลุ CORS บล็อกบน GitHub Pages
            const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`;

            try {
                const response = await fetch(proxyUrl);
                if (!response.ok) throw new Error("API Connection Failed");

                const data = await response.json();

                if (Array.isArray(data) && data.length > 0) {
                    allCameras = data;
                    statusText.innerText = `✅ โหลดสำเร็จ! พบกล้อง ${allCameras.length} จุด`;
                    renderMap();
                } else {
                    statusText.innerText = "⚠️ ไม่พบรายการกล้องจาก API";
                }
            } catch (error) {
                console.error("ดึงข้อมูลกล้อง Longdo ล้มเหลว:", error);
                statusText.innerText = "❌ ดึงกล้องไม่สำเร็จ (โปรดลองกดปุ่มดึงใหม่)";
            }
        }

        function refreshImage(imgId, baseUrl) {
            const imgEl = document.getElementById(imgId);
            if (imgEl && baseUrl) {
                const ts = new Date().getTime();
                const sep = baseUrl.includes('?') ? '&' : '?';
                imgEl.src = `${baseUrl}${sep}_t=${ts}`;
            }
        }

        function focusLocation(lat, lng, locId) {
            map.flyTo([lat, lng], 15, { duration: 1.2 });
            if (markerInstances[locId]) {
                markerInstances[locId].openPopup();
            }
        }

        // 3. ปักหมุดกล้องทั้งหมดลงบน Leaflet
        function renderMap() {
            markersLayerGroup.clearLayers();
            markerInstances = {};
            const cameraContainer = document.getElementById('cameraContainer');
            cameraContainer.innerHTML = '';

            let bounds = [];

            allCameras.forEach(cam => {
                const title = cam.title || cam.name || "กล้อง CCTV จราจร";
                const lat = parseFloat(cam.lat);
                const lng = parseFloat(cam.long || cam.lng);
                const imgUrl = cam.url || cam.image || "";

                if (isNaN(lat) || isNaN(lng)) return;
                if (searchQuery && !title.toLowerCase().includes(searchQuery.toLowerCase())) return;

                bounds.push([lat, lng]);

                // สร้างไอคอนหมุดสีฟ้า
                const customIcon = L.divIcon({
                    className: 'custom-pin',
                    html: `<div style="background-color: #0284c7; width: 16px; height: 16px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 6px rgba(0,0,0,0.3);"></div>`,
                    iconSize: [16, 16],
                    iconAnchor: [8, 8]
                });

                const imgId = `img-${cam.id}`;
                const popupHtml = `
                    <div class="popup-content">
                        <h3>📹 ${title}</h3>
                        <img id="${imgId}" class="cctv-preview" src="${imgUrl}" alt="ภาพสด CCTV">
                        <button class="btn-refresh" onclick="refreshImage('${imgId}', '${imgUrl}')">🔄 กดดึงภาพสดใหม่</button>
                    </div>
                `;

                const marker = L.marker([lat, lng], { icon: customIcon }).bindPopup(popupHtml);
                marker.on('popupopen', () => refreshImage(imgId, imgUrl));
                markersLayerGroup.addLayer(marker);
                markerInstances[cam.id] = marker;

                // เพิ่มลงใน Sidebar ค้นหา
                const item = document.createElement('div');
                item.className = 'camera-item';
                item.onclick = () => focusLocation(lat, lng, cam.id);
                item.innerHTML = `📷 ${title}`;
                cameraContainer.appendChild(item);
            });

            if (cameraContainer.children.length === 0) {
                cameraContainer.innerHTML = '<div style="font-size:11px; color:#64748b;">ไม่พบจุดกล้องที่ตรงตามคำค้นหา</div>';
            }

            if (bounds.length > 0 && !searchQuery) {
                map.fitBounds(bounds, { padding: [30, 30], maxZoom: 12 });
            }
        }

        function onSearchChange() {
            searchQuery = document.getElementById('searchInput').value.trim();
            renderMap();
        }

        // เริ่มต้นโหลดจุดกล้องทันทีที่เปิดเว็บ
        fetchLongdoCameras();
    </script>
</body>
</html>
